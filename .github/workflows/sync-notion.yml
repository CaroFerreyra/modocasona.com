name: Sync events from Notion

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours automatically
  workflow_dispatch:          # manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch events from Notion
        env:
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node .github/scripts/sync-notion.js

      - name: Commit updated events.json (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git diff --staged --quiet \
            && echo "No changes." \
            || (git commit -m "chore: sync events from Notion [skip ci]" && git push)
